[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lecturelens"
version = "0.3.0"
description = "Real-time multimodal multi-agent lecture note-taking system"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "redis>=5.0",
    "typer>=0.12",
    "rich>=13.0",
    "httpx>=0.25",
    "typing-extensions>=4.5",
    "numpy>=1.24",
    "websockets>=12.0",
    "psycopg[binary]>=3.1.0",
]

[project.optional-dependencies]
full = [
    "sounddevice>=0.4",
    "soundcard>=0.4",
    "numpy>=1.24",
    "faster-whisper>=1.0",
    "mss>=9.0",
    "Pillow>=10.0",
    "langchain-core>=0.3",
    "langchain-ollama>=0.2",
    "langchain-openai>=0.2",
    "langchain-google-genai>=2.0",
    "langgraph>=0.2",
    "chromadb>=0.5",
    "websockets>=12.0",
]
client = [
    "sounddevice>=0.4",
    "soundcard>=0.4",
    "numpy>=1.24",
    "mss>=9.0",
    "Pillow>=10.0",
    "websockets>=12.0",
]

dev = [
    "pytest>=7.0",
]

[project.scripts]
lecturelens = "lecturelens.cli.main:app"

[tool.setuptools.packages.find]
include = ["lecturelens*"]
