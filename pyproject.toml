[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lecturelens"
version = "0.11.0"
description = "Real-time multimodal multi-agent lecture note-taking system"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "redis>=5.0",
    "typer>=0.12",
    "rich>=13.0",
    "httpx>=0.25",
    "numpy>=1.24",
    "packaging>=23.0",
    "python-dotenv>=1.0",
    # Video mode decodes a recorded lecture file with PyAV, so the audio
    # track and the frames come without any external capture.
    "av>=12",
    "opencv-python>=4.8",
    "websockets>=12.0",
    "psycopg[binary]>=3.1.0",
    # Required by the default `lecturelens start` flow: the structuring agent
    # and the router import langchain-core, the router imports
    # langchain-ollama, and the screen agent imports Pillow. Without these
    # the base install could not run a lecture at all.
    #
    # The versions of the langchain packages have to agree with each other.
    # They did not have to before, and a machine with an old langgraph and a
    # new langchain-core could not start the agent that writes the notes. The
    # reason was only in the log of that agent.
    "langchain-core>=1.4.7,<2.0",
    "langchain-ollama>=1.0,<2.0",
    "Pillow>=10.0",
    # The notes are turned into a page that draws the formulas, so they
    # can be read in a browser without any other program.
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
]

[project.optional-dependencies]
full = [
    "sounddevice>=0.4",
    "soundcard>=0.4",
    "numpy>=1.24",
    "faster-whisper>=1.0",
    "mss>=9.0",
    "Pillow>=10.0",
    # The text of the screen is read on the machine, where it is free.
    "rapidocr>=3.0",
    "onnxruntime>=1.15.0",
    "langchain-core>=1.4.7,<2.0",
    "langchain-ollama>=1.0,<2.0",
    "langchain-openai>=1.0,<2.0",
    "langchain-google-genai>=3.0,<5.0",
    "chromadb>=0.5",
    "websockets>=12.0",
    "onnxruntime>=1.15.0",
]
qa = [
    # Vector indexing for `lecturelens ask`.
    "chromadb>=0.5",
    "onnxruntime>=1.15.0",
]
cloud = [
    "langchain-openai>=1.0,<2.0",
    "langchain-google-genai>=3.0,<5.0",
]
client = [
    "sounddevice>=0.4",
    "soundcard>=0.4",
    "numpy>=1.24",
    "mss>=9.0",
    "Pillow>=10.0",
    "websockets>=12.0",
    "onnxruntime>=1.15.0",
]

dev = [
    "pytest>=7.0",
]

[project.scripts]
lecturelens = "lecturelens.cli.main:app"

[tool.setuptools.packages.find]
include = ["lecturelens*"]
