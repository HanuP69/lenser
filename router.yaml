providers:
  gemma:
    type: ollama
    cloud: false
    model: "gemma4:e4b"
    num_ctx: 8192
    temperature: 0.2
    timeout_seconds: 180
    rate_limit:
      max_rpm: 120
      window_seconds: 60
    circuit_breaker:
      failure_threshold: 3
      cooldown_seconds: 30

  unorouter:
    type: openai_compatible
    cloud: true
    base_url: "https://api.unorouter.com/v1"
    model: "gemma-4-26b:free"
    api_key_env: "UNOROUTER_API_KEY"
    timeout_seconds: 120
    rate_limit:
      max_rpm: 20
      window_seconds: 60
    circuit_breaker:
      failure_threshold: 3
      cooldown_seconds: 60

  openrouter:
    type: openai_compatible
    cloud: true
    base_url: "https://openrouter.ai/api/v1"
    model: "openrouter/free"
    api_key_env: "OPENROUTER_API_KEY"
    timeout_seconds: 90
    rate_limit:
      max_rpm: 20
      window_seconds: 60
    circuit_breaker:
      failure_threshold: 5
      cooldown_seconds: 60

  gemini:
    type: google_genai
    cloud: true
    model: "gemini-3.5-flash"
    api_key_env: "GOOGLE_API_KEY"
    timeout_seconds: 90
    rate_limit:
      max_rpm: 15
      window_seconds: 60
    circuit_breaker:
      failure_threshold: 5
      cooldown_seconds: 60

task_routing:
  screen_ocr:
    - unorouter
    - gemma
    - openrouter
    - gemini
  structuring:
    - unorouter
    - gemma
    - openrouter
    - gemini
  qa:
    - unorouter
    - gemma
    - openrouter
    - gemini
