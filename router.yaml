providers:
  # The UnoRouter free tier allows one request per minute per model, and the
  # budget is per model. Listing several models in one chain multiplies the
  # effective rate: a 429 is a provider failure, so the chain falls through
  # to the next model, which has its own budget.
  #
  # The gemini free models do not forward the image to gemini, they answer
  # that no image was attached, so they are only used for the text tasks.

  # Vision models that were verified to receive the image.
  unorouter_vl_qwen:
    type: openai_compatible
    cloud: true
    base_url: "https://api.unorouter.com/v1"
    model: "qwen2.5-vl-7b-instruct-awq:free"
    api_key_env: "UNOROUTER_API_KEY"
    timeout_seconds: 120
    rate_limit:
      max_rpm: 1
      window_seconds: 60
    circuit_breaker:
      failure_threshold: 1
      cooldown_seconds: 60

  unorouter_vl_llama:
    type: openai_compatible
    cloud: true
    base_url: "https://api.unorouter.com/v1"
    model: "llama-3.2-11b-vision:free"
    api_key_env: "UNOROUTER_API_KEY"
    timeout_seconds: 120
    rate_limit:
      max_rpm: 1
      window_seconds: 60
    circuit_breaker:
      failure_threshold: 1
      cooldown_seconds: 60

  unorouter_vl_gemma:
    type: openai_compatible
    cloud: true
    base_url: "https://api.unorouter.com/v1"
    model: "gemma-4-26b:free"
    api_key_env: "UNOROUTER_API_KEY"
    timeout_seconds: 120
    rate_limit:
      max_rpm: 1
      window_seconds: 60
    circuit_breaker:
      failure_threshold: 1
      cooldown_seconds: 60

  # Text models.
  unorouter_structuring:
    type: openai_compatible
    cloud: true
    base_url: "https://api.unorouter.com/v1"
    model: "qwen3.6-35b-a3b:free"
    api_key_env: "UNOROUTER_API_KEY"
    timeout_seconds: 120
    rate_limit:
      max_rpm: 1
      window_seconds: 60
    circuit_breaker:
      failure_threshold: 1
      cooldown_seconds: 60

  unorouter:
    type: openai_compatible
    cloud: true
    base_url: "https://api.unorouter.com/v1"
    model: "gemini-3.6-flash:free"
    api_key_env: "UNOROUTER_API_KEY"
    timeout_seconds: 120
    rate_limit:
      max_rpm: 1
      window_seconds: 60
    circuit_breaker:
      failure_threshold: 1
      cooldown_seconds: 60

  unorouter_qa:
    type: openai_compatible
    cloud: true
    base_url: "https://api.unorouter.com/v1"
    model: "gemini-3.5-flash-lite:free"
    api_key_env: "UNOROUTER_API_KEY"
    timeout_seconds: 90
    rate_limit:
      max_rpm: 1
      window_seconds: 60
    circuit_breaker:
      failure_threshold: 1
      cooldown_seconds: 60

  unorouter_glm:
    type: openai_compatible
    cloud: true
    base_url: "https://api.unorouter.com/v1"
    model: "glm-4.5-flash:free"
    api_key_env: "UNOROUTER_API_KEY"
    timeout_seconds: 90
    rate_limit:
      max_rpm: 1
      window_seconds: 60
    circuit_breaker:
      failure_threshold: 1
      cooldown_seconds: 60

  gemma:
    type: ollama
    cloud: false
    model: "gemma4:e4b"
    num_ctx: 8192
    temperature: 0.2
    timeout_seconds: 180
    rate_limit:
      max_rpm: 120
      window_seconds: 60
    circuit_breaker:
      failure_threshold: 3
      cooldown_seconds: 30

  openrouter:
    type: openai_compatible
    cloud: true
    base_url: "https://openrouter.ai/api/v1"
    model: "openrouter/free"
    api_key_env: "OPENROUTER_API_KEY"
    timeout_seconds: 90
    rate_limit:
      max_rpm: 20
      window_seconds: 60
    circuit_breaker:
      failure_threshold: 5
      cooldown_seconds: 60

  gemini:
    type: google_genai
    cloud: true
    model: "gemini-3.5-flash"
    api_key_env: "GOOGLE_API_KEY"
    timeout_seconds: 90
    rate_limit:
      max_rpm: 15
      window_seconds: 60
    circuit_breaker:
      failure_threshold: 5
      cooldown_seconds: 60

task_routing:
  # The vision models come first. The gemini models do not receive the image
  # through this endpoint, so they are not used for the slides.
  screen_ocr:
    - unorouter_vl_qwen
    - unorouter_vl_llama
    - unorouter_vl_gemma
    - gemma
    - openrouter
    - gemini
  structuring:
    - unorouter_structuring
    - unorouter
    - unorouter_glm
    - gemma
    - openrouter
    - gemini
  qa:
    - unorouter_qa
    - unorouter
    - unorouter_glm
    - gemma
    - openrouter
    - gemini
