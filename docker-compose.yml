services:
  redis:
    image: redis:7-alpine
    container_name: lecturelens_redis
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: lecturelens_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lecturelens}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
